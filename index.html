/* ================= NORMALIZER ================= */

function normalize(text){

  let t =
    text
    .toLowerCase()
    .trim();


  const replacements = {

    "ape":"apa",

    "sape":"siapa",

    "siape":"siapa",

    "camne":"macam mana",

    "cmne":"macam mana",

    "nk":"nak",

    "nkk":"nak",

    "tk":"tak",

    "tkde":"tak ada",

    "takde":"tak ada",

    "xde":"tak ada",

    "dh":"dah",

    "yg":"yang",

    "dgn":"dengan",

    "kat":"di",

    "org":"orang",

    "kwn":"kawan",

    "klu":"kalau",

    "mcm":"macam",

    "bg":"bagi",

    "bgi":"bagi",

    "blh":"boleh",

    "takleh":"tak boleh",

    "xleh":"tak boleh",

    "skrg":"sekarang",

    "sbb":"sebab",

    "mkn":"makan",

    "minum":"minum",

    "tgh":"tengah",

    "dkt":"dekat",

    "nkbuat":"nak buat"

  };


  Object.keys(
    replacements
  ).forEach(word=>{

    const reg =
      new RegExp(
        "\\b" +
        word +
        "\\b",
        "g"
      );


    t =
      t.replace(
        reg,
        replacements[word]
      );

  });


  return t;

}


/* ================= MATH ================= */

function mathEngine(text){

  let t =
    text.replace(
      /,/g,
      ""
    );


  /* percentage */

  let percent =
    t.match(
      /(\d+(?:\.\d+)?)\s*%\s*(?:daripada|of)\s*(\d+(?:\.\d+)?)/
    );


  if(percent){

    const a =
      parseFloat(
        percent[1]
      );

    const b =
      parseFloat(
        percent[2]
      );


    const result =
      a / 100 * b;


    return (
      `${a}% daripada ${b} = ` +
      `${result}`
    );

  }


  /* fraction */

  let fraction =
    t.match(
      /(\d+(?:\.\d+)?)\s*daripada\s*(\d+(?:\.\d+)?)/
    );


  if(
    fraction &&
    !t.includes(
      "berapa peratus"
    )
  ){

    const a =
      parseFloat(
        fraction[1]
      );

    const b =
      parseFloat(
        fraction[2]
      );


    if(b !== 0){

      return (
        `${a} daripada ${b} = ` +
        `${((a/b)*100).toFixed(2)}%`
      );

    }

  }


  /* basic calculations */

  if(
    /^[\d\s+\-*/().×x÷]+$/.test(t)
  ){

    try{

      let expr =
        t
        .replace(
          /×/g,
          "*"
        )
        .replace(
          /x/g,
          "*"
        )
        .replace(
          /÷/g,
          "/"
        );


      if(
        !/^[\d\s+\-*/().]+$/.test(
          expr
        )
      ){
        return null;
      }


      const result =
        Function(
          '"use strict";return (' +
          expr +
          ')'
        )();


      if(
        Number.isFinite(result)
      ){

        return (
          "Jawapan = " +
          result
        );

      }

    }
    catch(e){}

  }


  return null;

}

/* ================= BRAIN ================= */

function brain(raw){

  const t =
    normalize(raw);


  /* Math */

  const math =
    mathEngine(t);

  if(math){
    return math;
  }


  /* Creator */

  const creator =
    creatorKnowledge(t);

  if(creator){
    return creator;
  }


  /* Greetings */

  if(
    /^(hi|hello|helo|hai|hey|wei|we|yo|assalamualaikum)/
    .test(t)
  ){

    const greetings = [

      "Hey! 👋 MoonBot V6 online.",

      "Yo! 🤖 Apa yang kau nak tanya?",

      "Hai! MoonBot sedia membantu."

    ];


    return greetings[
      Math.floor(
        Math.random() *
        greetings.length
      )
    ];

  }


  /* Thanks */

  if(
    t.includes("terima kasih") ||
    t.includes("thanks") ||
    t.includes("tq")
  ){

    return "Sama-sama bro 😎";

  }


  /* Identity */

  if(
    t.includes("siapa kau") ||
    t.includes("apa itu moonbot") ||
    t.includes("kau siapa")
  ){

    return (
      "Aku MoonBot V6 Pro 🤖 — " +
      "chatbot web yang dibina oleh Nazreel " +
      "menggunakan HTML, CSS dan JavaScript."
    );

  }


  /* Feelings */

  if(
    t.includes("sedih") ||
    t.includes("galau")
  ){

    return (
      "Kalau kau tengah sedih, tak apa untuk " +
      "berehat sekejap. Jangan paksa diri terlalu kuat."
    );

  }


  if(
    t.includes("marah")
  ){

    return (
      "Kalau tengah marah, berhenti sekejap dan " +
      "tarik nafas. Lepas dah tenang, baru fikir langkah seterusnya."
    );

  }


  if(
    t.includes("penat")
  ){

    return (
      "Kalau penat, rehat dulu bro. " +
      "Otak pun perlukan masa untuk recharge. 😴"
    );

  }


  /* Knowledge */

  for(
    const category of Object.keys(
      knowledge
    )
  ){

    for(
      const item of knowledge[category]
    ){

      const key =
        item[0];


      if(
        t.includes(key)
      ){

        return item[1];

      }

    }

  }


  /* General */

  if(
    t.includes("haiwan")
  ){

    return (
      "Haiwan ialah organisma hidup yang " +
      "biasanya memperoleh tenaga dengan memakan bahan organik."
    );

  }


  if(
    t.includes("batu")
  ){

    return (
      "Batu ialah bahan pepejal semula jadi " +
      "yang terdiri daripada satu atau beberapa mineral."
    );

  }


  if(
    t.includes("guru") ||
    t.includes("cikgu")
  ){

    return (
      "Guru ialah individu yang mendidik dan " +
      "membimbing murid dalam proses pembelajaran."
    );

  }


  if(
    t.includes("sekolah")
  ){

    return (
      "Sekolah ialah institusi pendidikan yang " +
      "menyediakan pembelajaran dan perkembangan sosial kepada murid."
    );

  }


  if(
    t.includes("iphone")
  ){

    return (
      "iPhone ialah telefon pintar yang dibangunkan oleh Apple."
    );

  }


  if(
    t.startsWith("apa itu")
  ){

    const subject =
      t
      .replace(
        "apa itu",
        ""
      )
      .trim();


    if(subject){

      return (
        `Aku belum ada pengetahuan khusus untuk "${subject}" ` +
        "dalam knowledge base tempatan aku."
      );

    }

  }


  return fallback(t);

}
